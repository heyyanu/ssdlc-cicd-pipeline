framework:
  - terraform
  - dockerfile

directory:
  - terraform
  - .

check:
  - CKV_DOCKER_1    # shh
  - CKV_DOCKER_2    # health check
  - CKV_DOCKER_3    # user created
  - CKV_DOCKER_4    # copy
  - CKV_DOCKER_7    # latest

  - CKV_TF_1       # commit hash 
  - CKV_TF_2       # tag and version 


skip-check:
  - CKV_DOCKER_8    


output:
  - cli
  - json

soft-fail-on:
  - LOW
  - MEDIUM