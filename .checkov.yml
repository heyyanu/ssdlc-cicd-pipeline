framework:
  - ansible
  - dockerfile

directory:
  - ansible
  - .

check:
  - CKV_DOCKER_1    # Ensure SSH port 22 is not exposed by the image.
  - CKV_DOCKER_2    # Require a container health check.
  - CKV_DOCKER_3    # Require a non-root container user.
  - CKV_DOCKER_4    # Prefer COPY over ADD.
  - CKV_DOCKER_7    # Require a specific base-image tag.
  - CKV_DOCKER_8    # Require the final container USER to be non-root.
  - CKV2_ANSIBLE_1  # The playbook polls Docker health status rather than using an HTTP uri task.
  - CKV2_ANSIBLE_2  # Enforce appropriate become_user usage.
  - CKV2_ANSIBLE_3  # Require rescue handling for Ansible blocks.


output:
  - cli
  - json

soft-fail-on:
  - LOW
  - MEDIUM
