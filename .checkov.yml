framework:
  - ansible
  - dockerfile

directory:
  - ansible
  - .

check:
  - CKV_DOCKER_1    # do not use sudo in RUN
  - CKV_DOCKER_2    # health check exists
  - CKV_DOCKER_3    # non-root user created
  - CKV_DOCKER_4    # use COPY not ADD
  - CKV_DOCKER_7    # do not use :latest tag

  - CKV2_ANSIBLE_1  # do not use shell/command module when alternatives exist
  - CKV2_ANSIBLE_2  # use become_user with become
  - CKV2_ANSIBLE_3  # do not use no_log: false on sensitive tasks

skip-check:
  - CKV_DOCKER_8    # do not store credentials in ENV (handled via Jenkins credentials)

output:
  - cli
  - json

soft-fail-on:
  - LOW
  - MEDIUM