name: SSDLC CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ssdlc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py

      - name: Run unit tests
        run: python -m pytest test_app.py -v

  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install scan tools
        run: |
          python -m pip install -r requirements.txt bandit pip-audit

      - name: Run Bandit
        run: bandit -r . -ll --exclude ./.venv,./ansible,./sbom-output

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

      - name: Install and run Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ASSET_ARCH="x64" ;;
            aarch64|arm64) ASSET_ARCH="arm64" ;;
            *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
          esac
          ASSET="gitleaks_${VERSION}_linux_${ASSET_ARCH}.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -fsSL "${BASE}/${ASSET}" -o "$RUNNER_TEMP/${ASSET}"
          curl -fsSL "${BASE}/gitleaks_${VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep -F "${ASSET}" checksums.txt | sha256sum --check --status)
          tar -xzf "$RUNNER_TEMP/${ASSET}" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --verbose .
