stages:
  - build
  - test
  - security

build:
  stage: build
  tags:
    - my-mac-runner
  script:
    - pip install -r requirements.txt
    - python -m py_compile app.py
    - echo "Build successful"

test:
  stage: test
  tags:
    - my-mac-runner
  script:
    - pip install -r requirements.txt
    - pip install pytest
    - pytest test_app.py -v

sast:
  stage: security
  tags:
    - my-mac-runner
  script:
    - pip install bandit
    - bandit -r . -ll --exclude ./.venv

semgrep:
  stage: security
  tags:
    - my-mac-runner
  script:
    - pip install semgrep
    - semgrep ci
  variables:
    SEMGREP_APP_TOKEN: $SEMGREP_APP_TOKEN

secret-scan:
  stage: security
  tags:
    - my-mac-runner
  script:
    - brew install gitleaks
    - gitleaks detect --source . --verbose

sca:
  stage: security
  tags:
    - my-mac-runner
  script:
    - npm install -g snyk
    - snyk auth $SNYK_TOKEN
    - snyk test --severity-threshold=high

