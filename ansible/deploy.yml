---
- name: Deploy ssdlc-app to staging on AWS EC2
  hosts: staging
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  vars:
    image_full_name: "{{ ecr_registry }}/{{ app_name }}:{{ image_tag }}"

  pre_tasks:
    - name: Validate supported OS and deployment inputs
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts['distribution'] == 'Amazon' and
             ansible_facts['distribution_major_version'] in ['2', '2023']) or
            ansible_facts['os_family'] == 'Debian'
          - ecr_registry is defined
          - aws_region is defined
          - image_tag is defined
          - ecr_password_file is defined
          - ecr_password_file | length > 0
        fail_msg: >-
          This playbook supports Amazon Linux 2, Amazon Linux 2023, Ubuntu and
          Debian. It also requires ecr_registry, aws_region, image_tag and the
          ecr_password_file path passed by Jenkins.

    - name: Check the temporary ECR password file on the Jenkins controller
      ansible.builtin.stat:
        path: "{{ ecr_password_file }}"
      delegate_to: localhost
      become: false
      register: ecr_password_file_stat
      run_once: true

    - name: Validate the temporary ECR password file
      ansible.builtin.assert:
        that:
          - ecr_password_file_stat.stat.exists | default(false)
          - ecr_password_file_stat.stat.isreg | default(false)
          - (ecr_password_file_stat.stat.size | default(0) | int) > 0
        fail_msg: >-
          Jenkins did not provide a readable, non-empty ECR password file.
          Verify the ECR token creation step and the ecr_password_file extra-var.
      run_once: true

    # Amazon Linux 2023: use DNF directly. Do not use apt based only on the
    # ansible_pkg_mgr fact; this avoids the previous missing-apt executable error.
    - name: Install Docker and curl on Amazon Linux 2023
      ansible.builtin.dnf:
        name:
          - docker
          - curl
        state: present
        update_cache: true
      when:
        - ansible_facts['distribution'] == 'Amazon'
        - ansible_facts['distribution_major_version'] == '2023'

    # Amazon Linux 2: Docker is installed from Amazon Linux Extras.
    - name: Install curl on Amazon Linux 2
      ansible.builtin.yum:
        name: curl
        state: present
        update_cache: true
      when:
        - ansible_facts['distribution'] == 'Amazon'
        - ansible_facts['distribution_major_version'] == '2'

    - name: Install Docker using Amazon Linux Extras on Amazon Linux 2
      ansible.builtin.command:
        argv:
          - amazon-linux-extras
          - install
          - docker
          - -y
        creates: /usr/bin/docker
      when:
        - ansible_facts['distribution'] == 'Amazon'
        - ansible_facts['distribution_major_version'] == '2'

    # Debian-family distributions use APT explicitly.
    - name: Install Docker and curl on Ubuntu or Debian
      ansible.builtin.apt:
        name:
          - docker.io
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

  tasks:
    - name: Authenticate to ECR and pull the requested image
      block:
        - name: Log in to ECR using the short-lived Jenkins token file
          ansible.builtin.command:
            argv:
              - docker
              - login
              - --username
              - AWS
              - --password-stdin
              - "{{ ecr_registry }}"
            stdin: "{{ lookup('ansible.builtin.file', ecr_password_file) }}"
            stdin_add_newline: false
          no_log: true
          changed_when: true

        - name: Pull the release image from ECR
          ansible.builtin.command:
            argv:
              - docker
              - pull
              - "{{ image_full_name }}"
          register: image_pull
          changed_when: true

      rescue:
        - name: Stop deployment when ECR authentication or image pull fails
          ansible.builtin.fail:
            msg: >-
              ECR authentication or image pull failed. Check the ECR registry,
              image tag, IAM permissions and outbound HTTPS connectivity from EC2.

      always:
        - name: Remove ECR login token from the remote Docker configuration
          ansible.builtin.command:
            argv:
              - docker
              - logout
              - "{{ ecr_registry }}"
          changed_when: false
          failed_when: false
          no_log: true

    - name: Inspect the current staging container
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - "{{ container_name }}"
      register: existing_container
      changed_when: false
      failed_when: false

    - name: Remove the previous staging container
      ansible.builtin.command:
        argv:
          - docker
          - container
          - rm
          - --force
          - "{{ container_name }}"
      when: existing_container.rc == 0
      changed_when: true

    - name: Start the new staging container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --detach
          - --name
          - "{{ container_name }}"
          - --restart
          - unless-stopped
          - --publish
          - "0.0.0.0:{{ external_port }}:{{ internal_port }}"
          - --env
          - "DEPLOYMENT_ENVIRONMENT={{ deployment_environment }}"
          - --env
          - "PORT={{ internal_port }}"
          - "{{ image_full_name }}"
      register: started_container
      changed_when: true

    - name: Wait for the published application port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ external_port }}"
        state: started
        delay: 2
        timeout: 90

    # The Dockerfile defines a Python-based HEALTHCHECK against /health.
    # Poll Docker's health state instead of making an HTTP request from Ansible.
    - name: Wait for the staging container to become healthy
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "{{ container_name }}"
      register: container_health
      changed_when: false
      retries: 20
      delay: 5
      until: >-
        container_health.rc == 0 and
        (container_health.stdout | from_json | first).State.Health.Status == 'healthy'

  post_tasks:
    - name: Print deployment information
      ansible.builtin.debug:
        msg:
          - "Deployment complete!"
          - "Application URL: http://{{ ansible_host }}:{{ external_port }}"
          - "Health URL: http://{{ ansible_host }}:{{ external_port }}/health"
          - "Container: {{ container_name }}"
          - "Image: {{ image_full_name }}"
          - "Environment: {{ deployment_environment }}"
