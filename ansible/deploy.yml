---
- name: Deploy ssdlc-app to Staging on AWS EC2
  hosts: staging
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml

  vars:
    image_full_name: "{{ ecr_registry }}/{{ app_name }}:{{ image_tag }}"

  pre_tasks:
    - name: Validate target operating system and deployment inputs
      ansible.builtin.assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat']
          - ansible_pkg_mgr in ['apt', 'dnf', 'yum']
          - ecr_registry is defined
          - aws_region is defined
          - image_tag is defined
          - lookup('env', 'ECR_PASSWORD') | length > 0
        fail_msg: >-
          Unsupported target OS or missing deployment input. This playbook supports
          Debian/Ubuntu (apt) and Red Hat/Amazon Linux (dnf/yum). The Jenkins
          deployment stage must export ECR_PASSWORD for the duration of this run.

    - name: Refresh APT package metadata on Debian-family hosts
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_pkg_mgr == 'apt'

    - name: Refresh DNF package metadata on DNF hosts
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_pkg_mgr == 'dnf'

    - name: Refresh YUM package metadata on YUM hosts
      ansible.builtin.yum:
        update_cache: true
      when: ansible_pkg_mgr == 'yum'

    - name: Install curl
      ansible.builtin.package:
        name: curl
        state: present

    - name: Install Docker from Amazon Linux Extras on Amazon Linux 2
      ansible.builtin.command:
        argv:
          - amazon-linux-extras
          - install
          - docker
          - -y
        creates: /usr/bin/docker
      when:
        - ansible_distribution == 'Amazon'
        - ansible_distribution_major_version == '2'

    - name: Install Docker from DNF on Amazon Linux 2023
      ansible.builtin.dnf:
        name: docker
        state: present
      when:
        - ansible_distribution == 'Amazon'
        - ansible_distribution_major_version == '2023'

    - name: Install Docker from APT on Debian-family hosts
      ansible.builtin.apt:
        name: docker.io
        state: present
      when: ansible_os_family == 'Debian'

    - name: Install Docker from YUM or DNF on other Red Hat-family hosts
      ansible.builtin.package:
        name: docker
        state: present
      when:
        - ansible_os_family == 'RedHat'
        - not (ansible_distribution == 'Amazon' and ansible_distribution_major_version in ['2', '2023'])

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

  tasks:
    - name: Authenticate to ECR and pull the requested image
      block:
        - name: Log in to ECR using the short-lived token generated by Jenkins
          ansible.builtin.command:
            argv:
              - docker
              - login
              - --username
              - AWS
              - --password-stdin
              - "{{ ecr_registry }}"
            stdin: "{{ lookup('env', 'ECR_PASSWORD') }}"
            stdin_add_newline: false
          no_log: true
          changed_when: true

        - name: Pull the release image from ECR
          ansible.builtin.command:
            argv:
              - docker
              - pull
              - "{{ image_full_name }}"
          register: image_pull
          changed_when: true
      always:
        - name: Remove ECR login token from Docker configuration
          ansible.builtin.command:
            argv:
              - docker
              - logout
              - "{{ ecr_registry }}"
          register: docker_logout
          changed_when: false
          failed_when: false
          no_log: true

    - name: Check whether the staging container already exists
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - "{{ container_name }}"
      register: existing_container
      changed_when: false
      failed_when: false

    - name: Remove the previous staging container
      ansible.builtin.command:
        argv:
          - docker
          - container
          - rm
          - --force
          - "{{ container_name }}"
      when: existing_container.rc == 0
      changed_when: true

    - name: Start the new staging container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --detach
          - --name
          - "{{ container_name }}"
          - --restart
          - "on-failure:3"
          - --publish
          - "0.0.0.0:{{ external_port }}:{{ internal_port }}"
          - --env
          - "DEPLOYMENT_ENVIRONMENT={{ deployment_environment }}"
          - "{{ image_full_name }}"
      register: started_container
      changed_when: true

    - name: Wait for the published application port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ external_port }}"
        state: started
        delay: 2
        timeout: 90

    - name: Wait for the staging application HTTP health check
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ external_port }}/health"
        method: GET
        status_code: 200
        return_content: true
      register: health_check
      retries: 10
      delay: 6
      until: health_check.status == 200

  post_tasks:
    - name: Print deployment information
      ansible.builtin.debug:
        msg:
          - "Deployment complete!"
          - "Application URL: http://{{ ansible_host }}:{{ external_port }}"
          - "Health URL: http://{{ ansible_host }}:{{ external_port }}/health"
          - "Container: {{ container_name }}"
          - "Image: {{ image_full_name }}"
          - "Environment: {{ deployment_environment }}"
