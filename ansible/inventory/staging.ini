# ansible/inventory/staging.ini
#
# In the CI pipeline this file is GENERATED by Jenkins (see Jenkinsfile
# "Deploy to Staging - Ansible" stage) so you don't edit it by hand.
#
# For manual runs, replace <EC2_PUBLIC_IP_OR_DNS> with your instance's
# public IP or DNS name, e.g.:
#   ansible_host=54.123.45.67
#   ansible_host=ec2-54-123-45-67.compute-1.amazonaws.com

[staging]
staging-host ansible_host=<EC2_PUBLIC_IP_OR_DNS> ansible_user=ec2-user

[staging:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'